<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Executor</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="header-title">
                <h1>Skill Executor</h1>
                <span class="version">v1.0.0</span>
            </div>
            <div class="api-key-section">
                <input type="password" id="apiKey" placeholder="输入 API Key">
                <button id="setApiKey">设置</button>
                <span id="apiKeyStatus" class="status-badge"></span>
            </div>
        </header>

        <!-- Main content -->
        <main>
            <!-- Tab navigation -->
            <nav class="tabs">
                <button class="tab active" data-tab="chat">
                    <span class="icon">💬</span>
                    <span>聊天</span>
                </button>
                <button class="tab" data-tab="skills">
                    <span class="icon">📚</span>
                    <span>Skills</span>
                </button>
                <button class="tab" data-tab="logs">
                    <span class="icon">📋</span>
                    <span>日志</span>
                </button>
            </nav>

            <!-- Chat tab -->
            <section id="chat-tab" class="tab-content active">
                <div class="chat-container">
                    <div id="chat-messages" class="messages">
                        <div class="message system">
                            欢迎使用 Skill Executor！输入你的问题，AI 将使用 Skills 来帮你完成。
                        </div>
                    </div>
                    <div class="input-area">
                        <textarea id="chat-input" placeholder="输入你的问题... (Shift+Enter 换行)" rows="3"></textarea>
                        <button id="send-btn">
                            <span class="btn-text">发送</span>
                            <span class="btn-loading" style="display: none;">发送中...</span>
                        </button>
                    </div>
                    <div class="connection-status">
                        <span id="ws-status" class="status-indicator disconnected">● WebSocket 未连接</span>
                    </div>
                </div>
            </section>

            <!-- Skills tab -->
            <section id="skills-tab" class="tab-content">
                <div class="skills-container">
                    <div class="skills-sidebar">
                        <div class="sidebar-header">
                            <h2>Skills 列表</h2>
                            <button id="refresh-skills" class="icon-btn" title="刷新">🔄</button>
                        </div>
                        <div id="skills-list" class="skills-list">
                            <div class="loading">加载中...</div>
                        </div>
                    </div>
                    <div class="skill-detail" id="skill-detail">
                        <div class="empty-state">
                            <div class="empty-icon">📖</div>
                            <p>选择一个 Skill 查看详情</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Logs tab -->
            <section id="logs-tab" class="tab-content">
                <div class="logs-container">
                    <div class="logs-header">
                        <h2>审计日志</h2>
                        <div class="logs-controls">
                            <select id="logs-limit">
                                <option value="50">最近 50 条</option>
                                <option value="100" selected>最近 100 条</option>
                                <option value="200">最近 200 条</option>
                                <option value="500">最近 500 条</option>
                            </select>
                            <button id="refresh-logs" class="icon-btn" title="刷新">🔄</button>
                        </div>
                    </div>
                    <div id="logs-list" class="logs-list">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer>
            <p>Skill Executor API v1.0.0 | Powered by FastAPI & Anthropic</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/skills.js"></script>
    <script src="/static/js/logs.js"></script>
</body>
</html>
